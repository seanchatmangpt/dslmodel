name: Test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admitted-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install actual distribution contract
        run: |
          python -m pip install --disable-pip-version-check -e '.[test]'
          python -m pip check

      - name: Compile admitted execution closure
        run: |
          python -m py_compile \
            src/dslmodel/__init__.py \
            src/dslmodel/capabilities.py \
            src/dslmodel/cli.py \
            src/dslmodel/selftest.py \
            src/dslmodel/commands/__init__.py \
            src/dslmodel/commands/consolidated_cli.py \
            src/dslmodel/generators/__init__.py \
            src/dslmodel/generators/openapi_models.py \
            tests/test_capabilities.py \
            tests/test_cli_modernization.py \
            tests/generators/test_openapi_models.py \
            tests/test_distribution_contract.py

      - name: Execute admitted verifier pack
        run: |
          python -m pytest --noconftest -o addopts= -q \
            tests/test_capabilities.py \
            tests/test_cli_modernization.py \
            tests/generators/test_openapi_models.py \
            tests/test_distribution_contract.py

      - name: Build and install wheel in a clean environment
        run: |
          python -m pip wheel --wheel-dir dist .
          python -m venv /tmp/dslmodel-wheel
          /tmp/dslmodel-wheel/bin/python -m pip install --disable-pip-version-check dist/dslmodel-*.whl
          /tmp/dslmodel-wheel/bin/python -m pip check
          /tmp/dslmodel-wheel/bin/dsl doctor --json --strict
          /tmp/dslmodel-wheel/bin/dsl dsl status --json --strict

      - name: Crown exact admitted surface
        run: |
          dsl --help
          dsl doctor --json --strict
          dsl dsl status --json --strict
          dsl dsl inventory --json
