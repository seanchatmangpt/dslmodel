name: Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependency-closed verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "pydantic>=2" "typer>=0.9" "rich>=13.7" "PyYAML>=6" "pytest>=8"

      - name: Compile admitted execution closure
        run: |
          python -m py_compile \
            src/dslmodel/__init__.py \
            src/dslmodel/capabilities.py \
            src/dslmodel/cli.py \
            src/dslmodel/selftest.py \
            src/dslmodel/commands/__init__.py \
            src/dslmodel/commands/consolidated_cli.py \
            src/dslmodel/generators/openapi_models.py \
            tests/test_capabilities.py \
            tests/test_cli_modernization.py \
            tests/generators/test_openapi_models.py

      - name: Execute 80/20 verifier pack
        run: |
          pytest -q \
            tests/test_capabilities.py \
            tests/test_cli_modernization.py \
            tests/generators/test_openapi_models.py

      - name: Crown exact admitted surface
        run: |
          python -m dslmodel.cli doctor --json --strict
          python -m dslmodel.cli dsl status --json --strict
