name: Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependency-closed verifier
        run: uv sync --locked

      - name: Compile admitted execution closure
        run: |
          uv run python -m py_compile \
            src/dslmodel/__init__.py \
            src/dslmodel/capabilities.py \
            src/dslmodel/cli.py \
            src/dslmodel/selftest.py \
            src/dslmodel/commands/__init__.py \
            src/dslmodel/commands/consolidated_cli.py \
            src/dslmodel/generators/openapi_models.py \
            tests/test_capabilities.py \
            tests/test_cli_modernization.py \
            tests/generators/test_openapi_models.py

      - name: Execute 80/20 verifier pack
        run: |
          uv run pytest -q \
            tests/test_capabilities.py \
            tests/test_cli_modernization.py \
            tests/generators/test_openapi_models.py

      - name: Crown exact admitted surface
        run: |
          uv run python -m dslmodel.cli doctor --json --strict
          uv run python -m dslmodel.cli dsl status --json --strict
