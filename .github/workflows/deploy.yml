name: Deploy

on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        required: true
        description: Deployment image channel
        default: development
        type: choice
        options: [development, acceptance, production]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      - name: Build admitted runtime without publication authority
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          push: false
          tags: ghcr.io/${{ github.repository }}:candidate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish-image:
    if: github.event_name != 'pull_request'
    needs: verify-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      - name: Resolve release channel
        id: image
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          image="${DOCKER_REGISTRY}/${GITHUB_REPOSITORY,,}"
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              channel="${DEPLOY_ENVIRONMENT}"
              ;;
            push)
              channel="${GITHUB_REF_NAME}"
              ;;
            *)
              echo "REFUSED:UNSUPPORTED_DEPLOY_EVENT ${GITHUB_EVENT_NAME}" >&2
              exit 2
              ;;
          esac
          {
            echo "image=${image}"
            echo "channel=${channel}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish receipted runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.channel }}
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
