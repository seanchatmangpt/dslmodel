[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/dslmodel/__init__.py",
    "src/dslmodel/capabilities.py",
    "src/dslmodel/cli.py",
    "src/dslmodel/selftest.py",
    "src/dslmodel/verbs.py",
    "src/dslmodel/commands/__init__.py",
    "src/dslmodel/commands/consolidated_cli.py",
    "src/dslmodel/generators/__init__.py",
    "src/dslmodel/generators/openapi_models.py",
    "src/dslmodel/readers/__init__.py",
    "src/dslmodel/readers/doc_reader.py",
    "src/dslmodel/pqc/__init__.py",
    "src/dslmodel/pqc/algorithms.py",
    "src/dslmodel/pqc/core.py",
    "src/dslmodel/pqc/global_manager.py",
    "src/dslmodel/pqc/multi_language.py",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "src/dslmodel/__init__.py",
    "src/dslmodel/capabilities.py",
    "src/dslmodel/cli.py",
    "src/dslmodel/selftest.py",
    "src/dslmodel/verbs.py",
    "src/dslmodel/commands/__init__.py",
    "src/dslmodel/commands/consolidated_cli.py",
    "src/dslmodel/generators/__init__.py",
    "src/dslmodel/generators/openapi_models.py",
    "src/dslmodel/readers/__init__.py",
    "src/dslmodel/readers/doc_reader.py",
    "src/dslmodel/pqc/__init__.py",
    "src/dslmodel/pqc/algorithms.py",
    "src/dslmodel/pqc/core.py",
    "src/dslmodel/pqc/global_manager.py",
    "src/dslmodel/pqc/multi_language.py",
]

[project]
name = "dslmodel"
version = "2024.12.22.2"
description = "Deterministic OpenAPI model manufacture with execution receipts."
authors = [{ name = "Sean Chatman", email = "info@chatmangpt.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "rich>=13.7,<16",
    "typer>=0.12.5,<1",
]

[project.scripts]
dsl = "dslmodel.cli:app"

[project.urls]
Repository = "https://github.com/seanchatmangpt/dslmodel"

[project.optional-dependencies]
pqc = [
    "cryptography>=49,<50",
]
readers = [
    "pypdf>=6.5,<7",
]
test = [
    "pytest>=8,<10",
]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
